<!-- =========================
NiyoGen Register Form
===========================-->
<section class="lg:pt-[180px] pt-[120px] lg:pb-[100px] pb-[70px]">
  <div class="main-container">
    <div
      data-ns-animate
      data-delay="0.1"
      class="max-w-[480px] mx-auto bg-background-1 dark:bg-background-6 rounded-[20px] py-14 px-8"
    >
      <!-- Header -->
      <div class="text-center mb-8">
        <h1 class="text-heading-4 font-semibold mb-2">Create your account</h1>
        <p class="text-tagline-1 text-secondary/70 dark:text-accent/70">
          Start building AI agent swarms today
        </p>
      </div>

      <form>
        <fieldset class="space-y-2 mb-4">
          <label
            for="fullname"
            class="block text-tagline-2 font-medium text-secondary dark:text-accent select-none"
          >
            Full Name
          </label>
          <input
            type="text"
            id="fullname"
            class="auth-form-input"
            placeholder="Enter your full name"
            required
          />
        </fieldset>

        <fieldset class="space-y-2 mb-4">
          <label
            for="email"
            class="block text-tagline-2 font-medium text-secondary dark:text-accent select-none"
          >
            Work Email
          </label>
          <input
            type="email"
            id="email"
            class="auth-form-input"
            placeholder="you@company.com"
            required
          />
        </fieldset>

        <fieldset class="space-y-2 mb-4">
          <label
            for="company"
            class="block text-tagline-2 font-medium text-secondary dark:text-accent select-none"
          >
            Company Name
          </label>
          <input
            type="text"
            id="company"
            class="auth-form-input"
            placeholder="Your company"
          />
        </fieldset>

        <fieldset class="space-y-2 mb-4">
          <label
            for="password"
            class="block text-tagline-2 font-medium text-secondary dark:text-accent select-none"
          >
            Password
          </label>
          <input
            type="password"
            id="password"
            class="auth-form-input"
            placeholder="At least 8 characters"
            required
          />
        </fieldset>

        <fieldset class="space-y-2 mb-6">
          <label
            for="confirm-password"
            class="block text-tagline-2 font-medium text-secondary dark:text-accent select-none"
          >
            Confirm Password
          </label>
          <input
            type="password"
            id="confirm-password"
            class="auth-form-input"
            placeholder="Re-enter your password"
            required
          />
        </fieldset>

        <!-- Terms & Conditions -->
        <div class="mb-6">
          <label class="inline-flex items-start gap-2 cursor-pointer">
            <input type="checkbox" name="terms" required class="peer sr-only" />
            <span
              class="size-5 shrink-0 mt-0.5 rounded border border-stroke-3 dark:border-stroke-7 relative after:absolute after:size-3 after:bg-primary-500 after:rounded-sm after:top-1/2 after:left-1/2 after:-translate-x-1/2 after:-translate-y-1/2 after:opacity-0 peer-checked:after:opacity-100 peer-checked:border-primary-500 cursor-pointer"
            ></span>
            <span class="text-tagline-2 text-secondary dark:text-accent select-none">
              I agree to the
              <a href="#" class="text-primary-500 hover:underline font-semibold">Terms of Service</a>
              and
              <a href="#" class="text-primary-500 hover:underline font-semibold">Privacy Policy </a>
            </span>
          </label>
        </div>

        <div class="mb-6">
          <button
            type="submit"
            class="btn btn-md btn-primary hover:btn-secondary dark:hover:btn-accent w-full before:content-none"
          >
            Create Account
          </button>
        </div>
      </form>

      <!-- Login Link -->
      <div class="text-center mb-8">
        <p
          class="text-tagline-2 text-secondary font-normal flex items-center justify-center gap-1 dark:text-accent"
        >
          Already have an account?
          <a href="./niyogen-login.html" class="text-primary-500 hover:underline font-semibold">
            Sign in
          </a>
        </p>
      </div>

      <!-- Divider -->
      <div class="relative mb-8">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-stroke-3 dark:border-stroke-7"></div>
        </div>
        <div class="relative flex justify-center text-sm">
          <span class="px-4 bg-background-1 dark:bg-background-6 text-tagline-2 text-secondary/60 dark:text-accent/60">
            Or continue with
          </span>
        </div>
      </div>

      <!-- Social Login -->
      <div class="space-y-3">
        <button
          type="button"
          class="flex items-center justify-center gap-3 w-full border border-stroke-3 dark:border-stroke-7 py-3 px-6 rounded-full cursor-pointer group transition-all duration-300 ease-in-out hover:bg-primary-500 hover:border-primary-500"
        >
          <span class="size-5 block shrink-0">
            <img src="images/icons/google.svg" alt="Google" class="size-full" />
          </span>
          <span
            class="text-tagline-2 font-medium text-secondary dark:text-accent group-hover:text-white transition-colors duration-300 ease-in-out"
          >
            Continue with Google
          </span>
        </button>

        <button
          type="button"
          class="flex items-center justify-center gap-3 w-full border border-stroke-3 dark:border-stroke-7 py-3 px-6 rounded-full cursor-pointer group transition-all duration-300 ease-in-out hover:bg-primary-500 hover:border-primary-500"
        >
          <span class="size-5 block shrink-0">
            <img src="images/icons/microsoft.svg" alt="Microsoft" class="size-full" />
          </span>
          <span
            class="text-tagline-2 font-medium text-secondary dark:text-accent group-hover:text-white transition-colors duration-300 ease-in-out"
          >
            Continue with Microsoft
          </span>
        </button>
      </div>
    </div>
  </div>
</section>
