<!-- =========================
Tour Guardian - Product Spotlight
===========================-->
<section id="tour-guardian" class="pt-10 md:pt-14 lg:pt-20 xl:pt-24 pb-2 bg-background-2">
  <div class="main-container">
    <div
      data-ns-animate
      data-delay="0.2"
      class="relative overflow-hidden rounded-4xl bg-secondary max-[426px]:rounded-2xl"
    >
      <!-- Reuse integration-bg for consistency with pricing section -->
      <div class="absolute inset-0 -z-0 pointer-events-none select-none">
        <img
          src="images/home-page-2/integration-bg.png"
          alt=""
          class="w-full h-full object-cover opacity-50"
        />
      </div>

      <!-- Subtle glow accent top-right -->
      <div
        class="absolute -top-20 -right-20 size-64 rounded-full bg-primary-500/10 blur-3xl pointer-events-none select-none"
      ></div>

      <div
        class="relative z-10 flex flex-col lg:flex-row items-center gap-8 lg:gap-12 px-8 sm:px-12 lg:px-16 py-12 lg:py-14 max-[426px]:px-6 max-[426px]:py-10"
      >
        <!-- ── Logo & Identity ── -->
        <div
          data-ns-animate
          data-delay="0.3"
          data-direction="left"
          data-offset="60"
          class="flex flex-col items-center lg:items-start gap-4 shrink-0"
        >
          <!-- Logo mark -->
          <div
            class="size-[72px] rounded-2xl bg-gradient-to-br from-primary-400 to-primary-600 flex items-center justify-center shadow-2xl ring-4 ring-white/10"
          >
            <svg
              class="size-9 text-white"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              stroke-width="1.6"
            >
              <!-- Map + shield hybrid: represents journey safety -->
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 6.75V15m6-6v8.25m.503 3.498 4.875-2.437c.381-.19.622-.58.622-1.006V4.82c0-.836-.88-1.38-1.628-1.006l-3.869 1.934c-.317.159-.69.159-1.006 0L9.503 3.252a1.125 1.125 0 0 0-1.006 0L3.622 5.689C3.24 5.88 3 6.27 3 6.695V19.18c0 .836.88 1.38 1.628 1.006l3.869-1.934c.317-.159.69-.159 1.006 0l4.994 2.497c.317.158.69.158 1.006 0Z"
              />
            </svg>
          </div>

          <!-- Brand -->
          <div class="text-center lg:text-left">
            <p class="text-accent/50 text-[11px] font-semibold tracking-[0.18em] uppercase mb-1">
              Powered by NiyoGen
            </p>
            <h3 class="text-accent font-bold text-heading-4 leading-tight">Tour Guardian</h3>
          </div>
        </div>

        <!-- Vertical divider (desktop only) -->
        <div class="hidden lg:block w-px self-stretch bg-white/10 shrink-0 my-2"></div>

        <!-- ── Summary + Journey Phases ── -->
        <div
          data-ns-animate
          data-delay="0.4"
          class="flex-1 flex flex-col gap-6 text-center lg:text-left"
        >
          <p class="text-accent/85 text-heading-6 font-normal leading-relaxed max-w-[540px] mx-auto lg:mx-0">
            An agentic AI travel companion that proactively plans your trip,
            keeps you safe on the ground, and rewards you when you're home.
          </p>

          <!-- Three journey-phase pills -->
          <div class="flex flex-wrap justify-center lg:justify-start items-center gap-2.5">
            <!-- Before -->
            <span
              class="inline-flex items-center gap-2 pl-1.5 pr-4 py-1.5 rounded-full bg-white/8 border border-white/12 text-accent/75 text-tagline-2 font-medium"
            >
              <span
                class="size-6 rounded-full bg-ns-green/20 border border-ns-green/40 flex items-center justify-center shrink-0"
              >
                <svg class="size-3.5 text-ns-green" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2" />
                  <circle cx="12" cy="12" r="9" stroke-linecap="round" />
                </svg>
              </span>
              Before — Plan smarter
            </span>

            <!-- Arrow connector -->
            <svg class="size-3.5 text-white/25 shrink-0 max-[480px]:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6" />
            </svg>

            <!-- During -->
            <span
              class="inline-flex items-center gap-2 pl-1.5 pr-4 py-1.5 rounded-full bg-white/8 border border-white/12 text-accent/75 text-tagline-2 font-medium"
            >
              <span
                class="size-6 rounded-full bg-primary-400/20 border border-primary-400/40 flex items-center justify-center shrink-0"
              >
                <svg class="size-3.5 text-primary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
                </svg>
              </span>
              During — Stay safe
            </span>

            <!-- Arrow connector -->
            <svg class="size-3.5 text-white/25 shrink-0 max-[480px]:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6" />
            </svg>

            <!-- After -->
            <span
              class="inline-flex items-center gap-2 pl-1.5 pr-4 py-1.5 rounded-full bg-white/8 border border-white/12 text-accent/75 text-tagline-2 font-medium"
            >
              <span
                class="size-6 rounded-full bg-ns-cyan/20 border border-ns-cyan/40 flex items-center justify-center shrink-0"
              >
                <svg class="size-3.5 text-ns-cyan" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z" />
                </svg>
              </span>
              After — Earn rewards
            </span>
          </div>
        </div>

        <!-- ── CTA ── -->
        <div
          data-ns-animate
          data-delay="0.5"
          data-direction="right"
          data-offset="60"
          class="shrink-0"
        >
          <a
            href="#contact"
            class="btn btn-accent hover:btn-primary btn-lg whitespace-nowrap shadow-lg"
          >
            <span>Learn more</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
