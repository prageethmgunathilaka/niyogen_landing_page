<!-- =========================
NiyoGen Hero Section
===========================-->
<section
  class="relative bg-white dark:bg-background-8 z-0 sm:pb-0 pb-14 lg:-mb-12 md:-mb-10 overflow-hidden"
  id="scene"
>
  <!-- Subtle Animated Gradient Layer -->
  <div class="absolute inset-0 w-full h-full overflow-hidden z-[-2]">
    <!-- Base gradient -->
    <div class="absolute inset-0 bg-gradient-to-br from-primary-50 via-white to-primary-100 dark:from-background-8 dark:via-background-5 dark:to-background-6"></div>
    
    <!-- Colorful animated gradient orbs -->
    <div class="absolute -top-[10%] -left-[5%] w-[600px] h-[600px] bg-primary-300/40 dark:bg-primary-900/30 rounded-full mix-blend-multiply dark:mix-blend-lighten filter blur-[120px] opacity-60 animate-blob"></div>
    <div class="absolute -top-[5%] -right-[10%] w-[650px] h-[650px] bg-primary-400/40 dark:bg-primary-800/30 rounded-full mix-blend-multiply dark:mix-blend-lighten filter blur-[120px] opacity-60 animate-blob animation-delay-2000"></div>
    <div class="absolute -bottom-[15%] left-[10%] w-[600px] h-[600px] bg-primary-500/35 dark:bg-primary-700/30 rounded-full mix-blend-multiply dark:mix-blend-lighten filter blur-[120px] opacity-50 animate-blob animation-delay-4000"></div>
    
    <!-- Cyan accent orbs -->
    <div class="absolute top-[20%] left-[15%] w-[500px] h-[500px] bg-ns-cyan/25 dark:bg-ns-cyan/20 rounded-full mix-blend-multiply dark:mix-blend-lighten filter blur-[100px] opacity-50 animate-blob animation-delay-1000"></div>
    <div class="absolute top-[30%] right-[10%] w-[450px] h-[450px] bg-ns-cyan/20 dark:bg-ns-cyan/15 rounded-full mix-blend-multiply dark:mix-blend-lighten filter blur-[90px] opacity-40 animate-blob animation-delay-3000"></div>
    
    <!-- Green accent orbs -->
    <div class="absolute bottom-[10%] right-[5%] w-[400px] h-[400px] bg-ns-green/20 dark:bg-ns-green/12 rounded-full mix-blend-multiply dark:mix-blend-lighten filter blur-[80px] opacity-50 animate-blob animation-delay-3000"></div>
  </div>

  <!-- Video Background - Full Coverage -->
  <figure class="absolute inset-0 w-full h-full hero-bg-overlay-light dark:hero-bg-overlay-dark z-[-1]"></figure>
  
  <!-- Light Mode Video -->
  <video
    class="w-full h-full absolute inset-0 scale-100 object-cover object-center z-[-1] dark:hidden block opacity-40"
    autoplay=""
    muted=""
    loop=""
    playsinline=""
  >
    <source src="/video/Tube.mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video>
  
  <!-- Dark Mode Video with Cyan Tint -->
  <video
    class="w-full h-full absolute inset-0 scale-100 object-cover object-center z-[-1] hidden dark:block opacity-50"
    style="filter: hue-rotate(160deg) saturate(1.6) brightness(0.9);"
    autoplay=""
    muted=""
    loop=""
    playsinline=""
  >
    <source src="/video/Tube-dark.mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video>
  
  <!-- Strong Cyan Overlay for Dark Mode -->
  <div class="absolute inset-0 bg-cyan-500/35 dark:bg-cyan-600/40 z-[-1] hidden dark:block"></div>

  <div class="relative sm:pt-[220px] pt-[140px] pb-[140px] max-[641px]:pb-16 max-[426px]:pb-10 z-10">
    <!-- Breadcrumb Navigation -->
    <nav aria-label="Breadcrumb" class="main-container mb-8">
      <ol class="flex items-center space-x-2 text-sm text-gray-600 dark:text-gray-400">
        <li>
          <a href="./index.html" class="hover:text-primary-500 transition-colors">Home</a>
        </li>
        <li class="flex items-center">
          <svg class="w-4 h-4 mx-2" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path>
          </svg>
          <span class="text-primary-500 font-medium">AI Agent Platform</span>
        </li>
      </ol>
    </nav>
    
    <!-- Content -->
    <div class="main-container flex flex-col items-center text-center z-10">
      <!-- <span data-ns-animate data-delay="0.1" class="badge badge-yellow mb-5">
        AI Agent Platform
      </span> -->
      <h1
        data-ns-animate
        data-delay="0.2"
        class="font-medium max-[426px]:mb-2.5 mb-4 max-[426px]:text-heading-5 max-sm:text-heading-4 max-sm:max-w-[450px]"
      >
        Build swarms of <span class="text-primary-500">AI Agents</span>
        <br class="hidden md:block" />
        from simple prompts
      </h1>
      <p data-ns-animate data-delay="0.3" class="max-w-[625px] mb-10 sm:mb-14 max-sm:max-w-[420px] text-lg">
        FastGraph Swarm Builder lets you compose multi‑agent workflows, integrate external systems, and evolve into industrial pipelines—with guardrails built in.
      </p>
        <ul class="flex flex-col md:flex-row gap-4 mb-7 md:mb-14 max-md:w-full">
          <li data-ns-animate data-delay="0.3" data-direction="left" data-offset="50">
            <a
              href="./niyogen-register.html"
              class="btn max-md:btn-md w-full md:w-auto max-md:mx-auto btn-xl dark:btn-accent btn-secondary hover:btn-white dark:hover:btn-transparent"
            >
              <span>Get started</span>
            </a>
          </li>
        <li data-ns-animate data-delay="0.5" data-direction="left" data-offset="50">
          <a
            href="#features"
            class="btn btn-white max-md:btn-md w-full md:w-auto max-md:mx-auto btn-xl hover:btn-secondary dark:btn-transparent dark:hover:btn-accent"
          >
            <span>See Features</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</section>
