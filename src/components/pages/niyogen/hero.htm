<!-- =========================
NiyoGen Hero Section
===========================-->
<section
  class="relative bg-background-8 z-0 sm:pb-0 pb-14 lg:-mb-12 md:-mb-10 overflow-hidden"
  id="scene"
>
  <!-- Subtle Animated Gradient Layer -->
  <div class="absolute inset-0 w-full h-full overflow-hidden z-[-2]">
    <!-- Base gradient -->
    <div class="absolute inset-0 bg-gradient-to-br from-background-8 via-background-5 to-background-6"></div>
    
    <!-- Colorful animated gradient orbs -->
    <div class="absolute -top-[10%] -left-[5%] w-[600px] h-[600px] bg-primary-900/30 rounded-full mix-blend-lighten filter blur-[120px] opacity-60 animate-blob"></div>
    <div class="absolute -top-[5%] -right-[10%] w-[650px] h-[650px] bg-primary-800/30 rounded-full mix-blend-lighten filter blur-[120px] opacity-60 animate-blob animation-delay-2000"></div>
    <div class="absolute -bottom-[15%] left-[10%] w-[600px] h-[600px] bg-primary-700/30 rounded-full mix-blend-lighten filter blur-[120px] opacity-50 animate-blob animation-delay-4000"></div>
    
    <!-- Cyan accent orbs -->
    <div class="absolute top-[20%] left-[15%] w-[500px] h-[500px] bg-ns-cyan/20 rounded-full mix-blend-lighten filter blur-[100px] opacity-50 animate-blob animation-delay-1000"></div>
    <div class="absolute top-[30%] right-[10%] w-[450px] h-[450px] bg-ns-cyan/15 rounded-full mix-blend-lighten filter blur-[90px] opacity-40 animate-blob animation-delay-3000"></div>
    
    <!-- Green accent orbs -->
    <div class="absolute bottom-[10%] right-[5%] w-[400px] h-[400px] bg-ns-green/12 rounded-full mix-blend-lighten filter blur-[80px] opacity-50 animate-blob animation-delay-3000"></div>
  </div>

  <!-- Video Background - Original (No Filters) -->
  <video
    class="w-full h-full absolute inset-0 scale-100 object-cover object-center z-[-1] opacity-100"
    autoplay=""
    muted=""
    loop=""
    playsinline=""
  >
    <source src="/video/openart-video.mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video>

  <div class="relative sm:pt-[220px] pt-[140px] pb-[140px] max-[641px]:pb-16 max-[426px]:pb-10 z-10">
    <!-- Content -->
    <div class="main-container flex flex-col items-center text-center z-10">
      <!-- <span data-ns-animate data-delay="0.1" class="badge badge-yellow mb-5">
        AI Agent Platform
      </span> -->
      <h1
        data-ns-animate
        data-delay="0.2"
        class="font-medium max-[426px]:mb-2.5 mb-4 max-[426px]:text-heading-5 max-sm:text-heading-4 max-sm:max-w-[450px] text-white"
      >
        Know before you Act
      </h1>
      <p data-ns-animate data-delay="0.3" class="max-w-[625px] mb-10 sm:mb-14 max-sm:max-w-[420px] text-white/80">
        AI that understands your situation and guides your next move
      </p>
        <ul class="flex flex-col md:flex-row gap-4 mb-7 md:mb-14 max-md:w-full">
          <li data-ns-animate data-delay="0.3" data-direction="left" data-offset="50">
            <a
              href="https://market.niyogen.com/"
              class="btn max-md:btn-md w-full md:w-auto max-md:mx-auto btn-xl btn-accent btn-secondary hover:btn-white hover:btn-transparent"
            >
              <span>Get started</span>
            </a>
          </li>
      </ul>
    </div>
  </div>
</section>
