<!-- =========================
NiyoGen Hero Section
===========================-->
<section
  class="relative bg-background-8 z-0 pb-14 overflow-hidden"
  id="scene"
>
  <!-- Video Background -->
  <video
    class="w-full h-full absolute inset-0 scale-100 object-cover object-center z-0 opacity-100"
    autoplay=""
    muted=""
    loop=""
    playsinline=""
  >
    <source src="/video/openart-video.mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video>

  <div class="relative sm:pt-[220px] pt-[140px] pb-[140px] max-[641px]:pb-16 max-[426px]:pb-10 z-[10]">
    <!-- Content -->
    <div class="main-container flex flex-col items-center text-center z-10">
      <h1
        data-ns-animate
        data-delay="0.2"
        class="font-medium max-[426px]:mb-2.5 mb-4 max-[426px]:text-heading-5 max-sm:text-heading-4 max-sm:max-w-[450px] text-white"
      >
        Know before you Act
      </h1>
      <p data-ns-animate data-delay="0.3" class="max-w-[625px] mb-10 sm:mb-14 max-sm:max-w-[420px] text-white/80">
        AI that understands your situation and guides your next move
      </p>
        <ul class="flex flex-col md:flex-row gap-4 mb-7 md:mb-14 max-md:w-full">
          <li data-ns-animate data-delay="0.3" data-direction="left" data-offset="50">
            <a
              href="https://market.niyogen.com/"
              class="btn max-md:btn-md w-full md:w-auto max-md:mx-auto btn-xl bg-primary-500 hover:bg-primary-600 text-white font-semibold shadow-lg hover:shadow-xl transition-all duration-300 inline-flex items-center gap-2 group"
            >
              <span>Get started</span>
              <svg class="size-5 text-white transition-transform duration-300 group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6" />
              </svg>
            </a>
          </li>
      </ul>
    </div>
  </div>
</section>
