<!-- =========================
NiyoGen Custom Header - Enhanced UI
===========================-->
<header>
  <div class="header-one opacity-0 rounded-full lp:!max-w-[1290px] xl:max-w-[1140px] lg:max-w-[960px] md:max-w-[720px] sm:max-w-[540px] min-[500px]:max-w-[450px] min-[425px]:max-w-[375px] max-w-[320px] mx-auto w-full fixed left-1/2 -translate-x-1/2 z-50 top-5 flex items-center justify-between px-4 xl:px-5 py-2.5 {=$class} shadow-lg backdrop-blur-md" data-ns-animate data-direction="up" data-offset="100">
    <!-- Logo with Icon -->
    <div class="flex items-center gap-2 shrink-0">
      <a href="./niyogen.html" class="flex items-center gap-2 group">
        <!-- DealMate Text Logo -->
        <span class="text-[22px] font-bold whitespace-nowrap group-hover:scale-105 transition-transform duration-300 tracking-wider">
          <span class="bg-gradient-to-r from-red-500 via-orange-500 to-yellow-500 bg-clip-text text-transparent">Deal</span><span class="bg-gradient-to-r from-green-500 via-cyan-500 via-blue-500 to-purple-500 bg-clip-text text-transparent">Mate</span>
        </span>
      </a>
    </div>

    <!-- Navigation Links (Desktop) -->
    <nav class="hidden xl:flex items-center gap-8 flex-1 justify-center">
      <!-- Navigation items hidden -->
    </nav>

    <!-- Get Started Button (Desktop) -->
    <div class="flex items-center justify-center shrink-0">
      <a href="https://market.niyogen.com/" class="group relative inline-flex items-center gap-2 px-6 py-2.5 bg-gradient-to-r from-primary-500 to-primary-600 hover:from-primary-600 hover:to-primary-700 text-white font-semibold text-[15px] rounded-full shadow-lg hover:shadow-xl transition-all duration-300 overflow-hidden whitespace-nowrap">
        <span class="relative z-10">Get started</span>
        <svg class="size-4 relative z-10 group-hover:translate-x-1 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6" />
        </svg>
        <span class="absolute inset-0 bg-gradient-to-r from-primary-600 to-primary-700 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span>
      </a>
    </div>

    <!-- Mobile Menu Toggle -->
    <div class="xl:hidden block">
      <button class="nav-hamburger flex flex-col gap-[5px] size-11 bg-background-6 rounded-xl items-center justify-center cursor-pointer hover:bg-primary-500 transition-all duration-300 group shadow-md">
        <span class="sr-only">Menu</span>
        <span class="block w-5 h-0.5 bg-accent group-hover:bg-white transition-colors duration-300"></span>
        <span class="block w-5 h-0.5 bg-accent group-hover:bg-white transition-colors duration-300"></span>
        <span class="block w-5 h-0.5 bg-accent group-hover:bg-white transition-colors duration-300"></span>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu fixed top-0 left-0 w-full h-screen bg-background-6/95 backdrop-blur-xl z-40 -translate-x-full transition-transform duration-300 overflow-y-auto">
    <div class="flex flex-col h-full">
      <!-- Mobile Header -->
      <div class="flex items-center justify-between p-6 border-b border-stroke-6">
        <a href="./niyogen.html" class="flex items-center gap-2.5">
          <!-- DealMate Text Logo -->
          <span class="text-[24px] font-bold whitespace-nowrap tracking-wide">
            <span class="bg-gradient-to-r from-red-500 via-orange-500 to-yellow-500 bg-clip-text text-transparent">Deal</span><span class="bg-gradient-to-r from-green-500 via-cyan-500 via-blue-500 to-purple-500 bg-clip-text text-transparent">Mate</span>
          </span>
        </a>
        <button class="nav-close size-11 flex items-center justify-center rounded-xl bg-background-8 hover:bg-primary-500 transition-all duration-300 group shadow-md">
          <svg class="size-5 text-accent group-hover:text-white transition-colors duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Mobile Navigation -->
      <nav class="flex-1 p-6">
        <ul class="space-y-4 mb-8">
          <!-- Navigation items hidden -->
        </ul>
        <!-- Mobile Get Started Button -->
        <div class="w-full">
          <a href="https://market.niyogen.com/" class="btn btn-primary hover:btn-white btn-lg w-full shadow-lg hover:shadow-xl hover:scale-[1.02] transition-all duration-300 flex items-center justify-center gap-2">
            <span>Get started</span>
            <svg class="size-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6" />
            </svg>
          </a>
        </div>
      </nav>
    </div>
  </div>
</header>
