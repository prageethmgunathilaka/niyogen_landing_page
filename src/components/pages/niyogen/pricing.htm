<!-- =========================
Pricing / Contact CTA Section
===========================-->
<section
  id="pricing"
  class="pt-14 md:pt-16 lg:pt-[88px] xl:pt-[100px] pb-14 md:pb-16 lg:pb-[88px] xl:pb-[100px]"
>
  <div class="main-container">
    <div class="text-center space-y-3 mb-14 md:mb-[70px]">
      <span data-ns-animate data-delay="0.1" class="badge badge-green mb-3.5 md:mb-5">
        Get Started
      </span>
      <h2 data-ns-animate data-delay="0.2">
        Contact us for a
        <span class="text-primary-500 inline-block">free demo</span>
      </h2>
      <p data-ns-animate data-delay="0.3" class="lg:max-w-[700px] mx-auto">
        Industry partnerships and pricing available on request.
      </p>
    </div>

    <div
      data-ns-animate
      data-delay="0.4"
      class="max-w-[900px] mx-auto bg-white dark:bg-background-7 p-8 lg:p-12 rounded-[20px] shadow-3"
    >
      <div class="flex flex-col lg:flex-row items-center justify-between gap-8">
        <div class="flex-1">
          <h3 class="text-heading-5 font-normal mb-4">Ready to explore NiyoGen?</h3>
          <p class="text-secondary/60 dark:text-accent/60 mb-6 lg:mb-0">
            Tell us about your use case. We'll set up a tailored walkthrough and share pricing options that fit your needs.
          </p>
        </div>
        <div class="flex flex-col sm:flex-row gap-4 lg:shrink-0">
          <a
            href="#contact"
            class="btn btn-primary hover:btn-white-dark dark:hover:btn-white btn-lg"
          >
            <span>Contact us</span>
          </a>
          <a
            href="#features"
            class="btn btn-white hover:btn-primary dark:btn-white-dark btn-lg"
          >
            <span>Learn more</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
